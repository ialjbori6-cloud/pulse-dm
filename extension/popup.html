<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PulseDM</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0e15;
        --panel: #121722;
        --panel-2: #171d2a;
        --line: rgba(255, 255, 255, 0.09);
        --text: #eaeef7;
        --muted: #8b94a9;
        --accent: #ffb020;
        --green: #37d39b;
        --red: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        background:
          radial-gradient(300px 160px at 100% -20%, rgba(255, 176, 32, 0.12), transparent 70%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        font-size: 13px;
        overflow: hidden;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 15px;
        border-bottom: 1px solid var(--line);
      }
      .logo {
        width: 34px;
        height: 34px;
        display: grid;
        place-items: center;
        border-radius: 10px;
        background: linear-gradient(140deg, #ffd15e, #ffb020 45%, #ff7a18);
        color: #1a1205;
        flex: 0 0 34px;
      }
      .logo svg { width: 19px; height: 19px; }
      .title { flex: 1; }
      .title h1 { margin: 0; font-size: 15px; letter-spacing: -0.2px; }
      .title h1 span { color: var(--accent); }
      .title p { margin: 1px 0 0; font-size: 10.5px; color: var(--muted); }
      .status {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border: 1px solid var(--line);
        border-radius: 99px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .status .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--red);
      }
      .status.online { color: var(--green); border-color: rgba(55, 211, 155, 0.25); }
      .status.online .dot { background: var(--green); box-shadow: 0 0 0 3px rgba(55, 211, 155, 0.12); }
      main { padding: 14px 15px 15px; }
      label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
      textarea {
        width: 100%;
        height: 64px;
        resize: none;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--panel);
        color: var(--text);
        font: inherit;
        font-size: 12px;
        outline: none;
        word-break: break-all;
      }
      textarea:focus { border-color: rgba(255, 176, 32, 0.5); box-shadow: 0 0 0 3px rgba(255, 176, 32, 0.1); }
      .row { display: flex; gap: 7px; margin-top: 8px; }
      button {
        font: inherit;
        cursor: pointer;
        border-radius: 9px;
        border: 1px solid transparent;
        height: 36px;
        padding: 0 13px;
        font-weight: 650;
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        transition: filter 0.15s ease, background 0.15s ease, border-color 0.15s ease;
      }
      button:disabled { opacity: 0.5; cursor: default; }
      .primary {
        flex: 1;
        background: linear-gradient(145deg, #ffc44d, #ffb020 40%, #ff7a18);
        color: #1a1205;
      }
      .primary:hover { filter: brightness(1.06); }
      .ghost { background: var(--panel); border-color: var(--line); color: var(--muted); }
      .ghost:hover { color: var(--text); border-color: rgba(255, 255, 255, 0.18); }
      .message { margin: 9px 0 0; font-size: 11.5px; min-height: 16px; color: var(--muted); }
      .message.error { color: var(--red); }
      .message.ok { color: var(--green); }
      .toggle {
        display: flex;
        align-items: flex-start;
        gap: 9px;
        margin-top: 14px;
        padding-top: 13px;
        border-top: 1px solid var(--line);
        cursor: pointer;
        color: var(--muted);
        font-size: 11.5px;
        line-height: 1.45;
      }
      .toggle input {
        appearance: none;
        width: 32px;
        height: 18px;
        flex: 0 0 32px;
        margin: 1px 0 0;
        border-radius: 99px;
        background: var(--panel-2);
        border: 1px solid var(--line);
        position: relative;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .toggle input::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--muted);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .toggle input:checked { background: rgba(255, 176, 32, 0.25); border-color: rgba(255, 176, 32, 0.4); }
      .toggle input:checked::after { transform: translateX(14px); background: var(--accent); }
      footer {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 15px 12px;
        border-top: 1px solid var(--line);
        font-size: 10.5px;
        color: var(--muted);
      }
      footer a { color: var(--accent); text-decoration: none; margin-left: auto; font-weight: 600; }
      footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v11" />
          <path d="m7.5 9.5 4.5 4.5 4.5-4.5" />
          <path d="M5 19h14" />
        </svg>
      </div>
      <div class="title">
        <h1>Pulse<span>DM</span></h1>
        <p>Download catcher</p>
      </div>
      <div class="status" id="status"><span class="dot"></span><span id="status-text">Offline</span></div>
    </header>

    <main>
      <label for="url">Download link</label>
      <textarea id="url" placeholder="https://example.com/file.zip" spellcheck="false"></textarea>
      <div class="row">
        <button class="primary" id="send" disabled>Send to PulseDM</button>
        <button class="ghost" id="paste" title="Paste from clipboard">Paste</button>
      </div>
      <p class="message" id="message"></p>

      <label class="toggle">
        <input type="checkbox" id="capture" />
        <span>Take over browser downloads<br /><span style="opacity: 0.7">Cancel Chrome downloads and route them to PulseDM.</span></span>
      </label>
    </main>

    <footer>
      <span>Local engine · 127.0.0.1:8787</span>
      <a href="http://127.0.0.1:8787" target="_blank" rel="noopener">Open app</a>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
